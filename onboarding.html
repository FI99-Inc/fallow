<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Fallow - Discover Your Activity DNA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="onboarding.css">
    <link rel="stylesheet" href="share.css">
</head>
<body>
    <!-- impeccable-disable flat-type-hierarchy -- every quiz screen is
         rendered into #screen-container by onboarding.js, so static analysis
         sees only the header. The question heading and .choice-card (1.75rem)
         carry the top of the scale. -->
    <header class="app-header">
        <button id="back-btn" class="hidden icon-btn" type="button" aria-label="Go back to the previous question">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="progress-group">
            <div class="progress-container" role="progressbar" aria-label="Quiz progress" aria-valuemin="1" aria-valuenow="1" aria-valuemax="13">
                <div id="progress-bar"></div>
            </div>
            <span class="step-counter" id="step-counter" data-numeric></span>
        </div>
        <div class="logo">Fallow</div>
    </header>
    <main id="app">
        <div id="screen-container">
            <!-- Dynamic screens rendered here via JS -->
        </div>
    </main>
    <script>
      window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
    </script>
    <script src="https://unpkg.com/@formspree/ajax@1" defer></script>
    <script type="module" src="onboarding.js"></script>
</body>
</html>
