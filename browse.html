<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fallow | Browse Activities</title>
    <meta name="description" content="Swipe through activities matched to your personality. Every reaction sharpens your recommendations.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="browse.css">
</head>
<body>
    <header class="browse-header">
        <a href="index.html" class="back-link" aria-label="Back to home">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <div class="logo">Fallow</div>
        <div class="card-counter" id="card-counter">1 / —</div>
    </header>

    <main class="browse-main">
        <div class="card-stack" id="card-stack">
            <!-- Cards injected by JS -->
        </div>

        <div class="empty-state hidden" id="empty-state">
            <h2>You've seen them all.</h2>
            <p>Your DNA has been refined based on every swipe. Head to your results to see updated recommendations.</p>
            <a href="results.html" class="btn-action">See updated recommendations</a>
        </div>
    </main>

    <footer class="browse-actions" id="browse-actions">
        <button class="action-btn action-pass" id="btn-pass" aria-label="Pass">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <button class="action-btn action-save" id="btn-save" aria-label="Save for later">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </button>
        <button class="action-btn action-like" id="btn-like" aria-label="Interested">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
    </footer>

    <script type="module" src="browse.js"></script>
</body>
</html>
